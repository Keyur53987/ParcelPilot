services:
  - type: web
    name: parcelpilot-ai
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && python build_vectorstore.py"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.1-8b-instant"
